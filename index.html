<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Center</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #00ff66;
      font-family: monospace;
    }

    .box {
      text-align: center;
      padding: 45px;
      border: 1px solid #00ff66;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
    }

    h1 {
      font-size: clamp(40px, 10vw, 100px);
      margin: 0 0 15px;
    }

    p {
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>FUCK YOU 🖕</h1>
    <p>Security verification complete.</p>
    <p>You got pranked. 💀</p>
  </div>
</body>
</html>
